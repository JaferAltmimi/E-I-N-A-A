name: mishkat_app
description: تطبيق مشكاة للقرآن والأذكار ومواقيت الصلاة والقبلة.
publish_to: none
version: 1.2.0+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.0.0
  equatable: ^2.0.7
  flutter_bloc: ^8.1.6
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.2.3
  geolocator: ^14.0.2
  intl: ^0.20.2
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  wakelock_plus: ^1.3.2
  speech_to_text: ^7.5.0
  geomag: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/mushaf/pages/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
